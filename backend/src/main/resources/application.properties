spring.application.name=questionshaper

# Active profile — local dev uses 'dev' (root/root DB).
# Production server overrides this via setenv.sh: -Dspring.profiles.active=prod
spring.profiles.active=dev

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/questionshaper?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# JWT Configuration
app.jwt-secret=9a4f2c8d3b7a1e6f45c8a0b3f2e6d9c8b4a7d3e6f9c8b4a7d3e5f4g6h7i8j9k0
app.jwt-expiration-milliseconds=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.testshaper=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
file.upload.dir=uploads


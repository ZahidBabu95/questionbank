spring.application.name=questionshaper

# Active profile: local dev uses 'dev' (root/root DB).
spring.profiles.active=dev

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/questionshaper?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (for high concurrent AI threads!)
spring.datasource.hikari.maximum-pool-size=250
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# JWT Configuration
app.jwt-secret=9a4f2c8d3b7a1e6f45c8a0b3f2e6d9c8b4a7d3e6f9c8b4a7d3e5f4g6h7i8j9k0
app.jwt-expiration-milliseconds=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.testshaper=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
file.upload.dir=uploads

# Pinecone Vector DB Settings (Hybrid RAG)
app.pinecone.api-key=pcsk_P2WWH_7bbZaFgrz2Fn1hoAYDug8uS194ujyGvNyg6aoqQyekYEWF3NooZV4Rgc9HzwjUJ
app.pinecone.index-name=questionshaper-index
app.pinecone.dimension=768

spring.application.name=questionshaper

# Default Profile Configuration
# spring.profiles.active=dev

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/questionshaper?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for concurrent AI threads)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# JWT Configuration
app.jwt-secret=9a4f2c8d3b7a1e6f45c8a0b3f2e6d9c8b4a7d3e6f9c8b4a7d3e5f4g6h7i8j9k0
app.jwt-expiration-milliseconds=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.testshaper=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
file.upload.dir=uploads

# Pinecone Vector DB Settings (Hybrid RAG)
app.pinecone.api-key=pcsk_P2WWH_7bbZaFgrz2Fn1hoAYDug8uS194ujyGvNyg6aoqQyekYEWF3NooZV4Rgc9HzwjUJ
app.pinecone.index-name=questionshaper-index
app.pinecone.dimension=768
app.pinecone.host=https://questionshaper-index-j93p4ul.svc.aped-4627-b74a.pinecone.io

# Gemini AI Configuration
app.gemini.api-key=YOUR_GEMINI_API_KEY_HERE
app.gemini.model=gemini-2.5-flash

# App info
app.name=QuestionShaper

# Email / SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.enabled=true

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://192.168.*:*,http://10.*:*,http://172.*:*,http://localhost:*

# Force UTF-8 Encoding for HTTP Requests
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# HTTP Gzip Compression (Reduces JSON network payload size by 90%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

logging.file.name=logs/app.log

# Redis Configuration (Distributed Cache)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms
# Enable redis by default, but graceful fallback to caffeine if offline
app.redis.enabled=true

# Meilisearch Configuration (Ultra-Fast Search Engine)
app.meilisearch.host=http://localhost:7700
app.meilisearch.api-key=masterKey
app.meilisearch.enabled=true

# API Security & Rate Limiting Configuration
app.ratelimit.enabled=true
app.ratelimit.public-limit=120
app.ratelimit.auth-limit=300

# Spring Boot Actuator & Observability Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=true